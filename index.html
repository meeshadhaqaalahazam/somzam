<style>
/* Layout: left sidebar with collapsible groups; content = page header + spreadsheet-style sheets and summary cards. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --surface-2: #eceee9; --line: #d9dcd4; --grid: #d3d7cf; --head: #e3e8df; --calc: #f6f7f3;
  --fg: #1d221f; --muted: #5f675f;
  --side-bg: #1f2a26; --side-fg: #c9d2cc; --side-hover: #2b3833; --side-active: #34443e;
  --accent: #b7791f; --accent-soft: #f4e6cc;
  --in: #2f7d4f; --in-soft: #dcefe2; --out: #b23a32; --out-soft: #f6dcd9; --warn: #a8641a; --warn-soft: #f6e5cf;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --surface: #1c2320; --surface-2: #232b28; --line: #313b37; --grid: #34403b; --head: #26302c; --calc: #19201d;
    --fg: #e6ebe7; --muted: #9aa59e; --side-bg: #101513; --side-fg: #b9c4bd; --side-hover: #1d2522; --side-active: #27322e;
    --accent: #e0a446; --accent-soft: #3b2f1c; --in: #6cc08d; --in-soft: #1d3326; --out: #ec7d74; --out-soft: #3d2220; --warn: #e3a35a; --warn-soft: #3a2c1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1c2320; --surface-2: #232b28; --line: #313b37; --grid: #34403b; --head: #26302c; --calc: #19201d;
  --fg: #e6ebe7; --muted: #9aa59e; --side-bg: #101513; --side-fg: #b9c4bd; --side-hover: #1d2522; --side-active: #27322e;
  --accent: #e0a446; --accent-soft: #3b2f1c; --in: #6cc08d; --in-soft: #1d3326; --out: #ec7d74; --out-soft: #3d2220; --warn: #e3a35a; --warn-soft: #3a2c1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
.app { display: flex; min-height: 100%; }

/* Sidebar */
.side { width: 250px; flex-shrink: 0; background: var(--side-bg); color: var(--side-fg); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding-left: env(safe-area-inset-left, 0px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #1a1408; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 17px; color: #fff; }
.brand-sub { font-size: 11px; opacity: .7; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px 20px; }
.nav-item, .nav-group > button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; color: var(--side-fg);
  padding: 10px; border-radius: 7px; cursor: pointer; text-align: left; font-weight: 500; text-decoration: none; }
.nav-item:hover, .nav-group > button:hover { background: var(--side-hover); color: #fff; }
.nav-item:focus-visible, .nav-group > button:focus-visible, .sub a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.nav-item.active { background: var(--side-active); color: #fff; }
.nav-group.open > button { color: #fff; }
.nav svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav .tag { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 99px; margin-left: 2px; }
.tag.in { background: var(--in); color: #fff; } .tag.out { background: var(--out); color: #fff; }
.chev { margin-left: auto; transition: transform .15s; opacity: .6; width: 14px !important; height: 14px !important; }
.nav-group.open .chev { transform: rotate(90deg); }
.sub { display: none; flex-direction: column; gap: 1px; padding: 2px 0 6px 39px; }
.nav-group.open .sub { display: flex; }
.sub a { color: var(--side-fg); text-decoration: none; padding: 7px 10px; border-radius: 6px; font-size: 13.5px; }
.sub a:hover { background: var(--side-hover); color: #fff; }
.sub a.active { color: #fff; background: var(--side-active); box-shadow: inset 2px 0 0 var(--accent); }
.side-foot { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--side-hover); font-size: 12px; opacity: .8; }

/* Main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 8px; cursor: pointer; }
.crumb { color: var(--muted); font-size: 13px; min-width: 0; }
.crumb b { color: var(--fg); font-weight: 600; }
.spacer { flex: 1; }
.test-pill { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--warn); font-weight: 600; white-space: nowrap; }
.content { padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1240px; width: 100%; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.page-head h1 { font-family: var(--f-display); font-size: 24px; font-weight: 700; margin: 0; text-wrap: balance; }
.page-head p { margin: 2px 0 0; color: var(--muted); max-width: 70ch; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1408; font-weight: 600; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select.btn { padding-right: 10px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { font-family: var(--f-display); font-size: 15px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h2 .link { margin-left: auto; font-family: var(--f-body); font-size: 12.5px; font-weight: 500; color: var(--accent); text-decoration: none; }
.grid { display: grid; gap: 14px; }
.g-kpi { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.g-2 { grid-template-columns: 2fr 1fr; }
.g-2e { grid-template-columns: 1fr 1fr; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; }
.value { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--muted); }
.c-in { color: var(--in); } .c-out { color: var(--out); }

/* Big money in / out cards */
.big { display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: inherit; border-width: 1px; transition: border-color .15s; }
.big:hover { border-color: var(--muted); }
.big .top { display: flex; align-items: center; gap: 10px; }
.big .ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; }
.big.in .ic { background: var(--in-soft); color: var(--in); } .big.out .ic { background: var(--out-soft); color: var(--out); }
.big .ic svg { width: 20px; height: 20px; }
.big .title { font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.big .amount { font-family: var(--f-display); font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.big.in .amount { color: var(--in); } .big.out .amount { color: var(--out); }
.big .open { margin-left: auto; font-size: 12.5px; color: var(--accent); font-weight: 500; }

.lines { display: flex; flex-direction: column; gap: 9px; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 13.5px; }
.line .v { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.line .track { grid-column: 1 / -1; height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.line .fill { height: 100%; border-radius: 99px; background: var(--accent); }
.line .fill.in { background: var(--in); } .line .fill.out { background: var(--out); }
.result { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); gap: 10px; flex-wrap: wrap; }
.result b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }

/* Read-only data tables */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.data th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
table.data .num { text-align: right; font-family: var(--f-mono); font-size: 13px; }
table.data tfoot td { font-weight: 700; border-top: 2px solid var(--line); }
.chip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.chip.in { background: var(--in-soft); color: var(--in); } .chip.out { background: var(--out-soft); color: var(--out); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.neutral { background: var(--surface-2); color: var(--muted); }

/* Spreadsheet */
.sheet-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sheet-tools .hint { color: var(--muted); font-size: 12.5px; margin-left: auto; }
.sheet-wrap { overflow: auto; border: 1px solid var(--grid); border-radius: 6px; background: var(--surface); max-height: 70vh; }
table.sheet { border-collapse: collapse; width: max-content; min-width: 100%; font-variant-numeric: tabular-nums; }
.sheet th, .sheet td { border: 1px solid var(--grid); padding: 0; height: 31px; white-space: nowrap; }
.sheet thead th { position: sticky; z-index: 2; }
.sheet .letters th { top: 0; height: 22px; background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 500; text-align: center; }
.sheet .names th { top: 22px; background: var(--head); font-weight: 600; font-size: 12.5px; padding: 0 8px; text-align: left; }
.sheet .names th.r, .sheet td.calc { text-align: right; }
.sheet .rn { width: 40px; min-width: 40px; background: var(--surface-2); color: var(--muted); text-align: center; font-size: 11.5px; position: relative; }
.sheet .rn button { display: none; position: absolute; inset: 3px; border: 0; border-radius: 4px; background: var(--out-soft); color: var(--out); cursor: pointer; font-weight: 700; }
.sheet tr:hover .rn button, .sheet .rn button:focus-visible { display: block; }
.sheet input, .sheet select { width: 100%; height: 31px; border: 0; background: transparent; padding: 0 8px; outline: none; font-size: 13.5px; border-radius: 0; }
.sheet input.n { text-align: right; font-family: var(--f-mono); font-size: 13px; }
.sheet td:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; position: relative; z-index: 1; background: var(--surface); }
.sheet td.calc { background: var(--calc); padding: 0 8px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.sheet td.calc.strong { color: var(--fg); font-weight: 600; }
.sheet td.calc.owe { color: var(--out); font-weight: 600; }
.sheet tfoot td { font-weight: 700; background: var(--surface-2); padding: 0 8px; position: sticky; bottom: 0; }
.sheet tfoot td.num { text-align: right; font-family: var(--f-mono); font-size: 13px; }
.legend-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend-row i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--grid); vertical-align: -2px; margin-right: 5px; border-radius: 2px; }

/* Settings form */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; min-width: 0; font-family: var(--f-mono); }
.field input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.field small { color: var(--muted); }

.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.callout { padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--fg); font-size: 13.5px; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 8px; font-weight: 500; z-index: 30; }
.scrim { display: none; }

@media (max-width: 900px) { .g-2, .g-2e { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .side { position: fixed; left: 0; top: 0; bottom: 0; height: 100%; z-index: 20; transform: translateX(-100%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
  .app.menu-open .side { transform: none; }
  .app.menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 15; }
  .menu-btn { display: inline-flex; }
  .form { grid-template-columns: 1fr; }
  .test-pill { display: none; }
  .big .amount { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// Gold brought in: value = grams x price; minus advance still open for that customer (from earlier advances), transport and machine cost.
function deriveIntake() {
  const events = [];
  S.advances.forEach(a => events.push({ date: a.date || '', kind: 0, a }));
  S.intake.forEach((r, i) => events.push({ date: r.date || '', kind: 1, r, i }));
  events.sort((x, y) => x.date.localeCompare(y.date) || x.kind - y.kind);
  const bal = {}, out = [];
  events.forEach(e => {
    if (e.kind === 0) { const c = norm(e.a.customer); bal[c] = (bal[c] || 0) + num(e.a.amount); return; }
    const c = norm(e.r.customer);
    const value = num(e.r.grams) * num(e.r.price);
    const adv = bal[c] || 0;
    const tr = num(e.r.transport), mc = machineCost(e.r.machine);
    const pay = value - adv - tr - mc;
    bal[c] = pay < 0 ? -pay : 0;
    out[e.i] = { value, adv, mc, pay };
  });
  return { rows: out, bal };
}
const deriveRows = {
  intake: () => deriveIntake().rows,
  sales: () => S.sales.map(r => ({ total: num(r.grams) * num(r.price) })),
  mercury: () => S.mercury.map(r => ({ cost: num(r.grams) * num(S.settings.mercuryPrice), name: (S.machines.find(m => norm(m.no) === norm(r.machine)) || {}).name || '' })),
  machines: () => S.machines.map(m => ({ uses: S.intake.filter(r => norm(r.machine) === norm(m.no)).length + S.mercury.filter(r => norm(r.machine) === norm(m.no)).length }))
};

function stockMoves() {
  const mv = [];
  S.intake.forEach(r => { if (num(r.grams)) mv.push({ date: r.date, who: r.customer, inn: num(r.grams), out: 0, what: 'Brought in by customer' }); });
  S.sales.forEach(r => { if (num(r.grams)) mv.push({ date: r.date, who: r.buyer, inn: 0, out: num(r.grams), what: 'Sold' }); });
  mv.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  let bal = num(S.settings.opening);
  mv.forEach(m => { bal += m.inn - m.out; m.bal = bal; });
  return { moves: mv, now: bal };
}

// Money in / out for a period filter (date string -> boolean)
function money(inPeriod, withSalaries) {
  const intake = deriveIntake().rows;
  const sales = sum(S.sales.filter(r => inPeriod(r.date)), r => num(r.grams) * num(r.price));
  const gold = sum(S.intake.map((r, i) => ({ r, d: intake[i] })).filter(x => inPeriod(x.r.date)), x => Math.max(0, x.d ? x.d.pay : 0));
  const advances = sum(S.advances.filter(r => inPeriod(r.date)), r => num(r.amount));
  const expenses = sum(S.expenses.filter(r => inPeriod(r.date)), r => num(r.amount));
  const mercury = sum(S.mercury.filter(r => inPeriod(r.date)), r => num(r.grams) * num(S.settings.mercuryPrice));
  const salaries = withSalaries ? sum(S.salaries, r => num(r.salary)) : 0;
  const out = gold + advances + expenses + mercury + salaries;
  return { sales, gold, advances, expenses, mercury, salaries, out, net: sales - out };
}

function fmtCell(f, v) {
  if (v === undefined || v === null) return '';

  if (f === 'n') return String(Math.round(v * 100) / 100);
  if (f === 'pay') return v < 0 ? 'Still owes ' + K(-v) : K(v);
  return esc(v);
}

function refreshSheet(key) {
  const table = document.querySelector(`table.sheet[data-sheet="${key}"]`);
  if (!table) return;
  const sh = SHEETS[key];
  const D = deriveRows[key] ? deriveRows[key]() : [];
  table.querySelectorAll('[data-calc]').forEach(td => {
    const c = sh.cols.find(x => x.k === td.dataset.calc);
    const v = (D[+td.dataset.r] || {})[c.k];
    td.textContent = fmtCell(c.f, v).replace(/&amp;/g, '&');
    td.classList.toggle('owe', c.f === 'pay' && v < 0);
  });
  table.querySelectorAll('[data-total]').forEach(td => {
    const k = td.dataset.total; if (!k) return;
    const c = sh.cols.find(x => x.k === k);
    const vals = S[key].map((row, r) => c.t === 'calc' ? ((D[r] || {})[k] || 0) : num(row[k]));
    if (c.total === 'pay') td.textContent = 'Paid ' + K(sum(vals, v => Math.max(0, v)));
    else td.textContent = fmtCell(c.total, sum(vals, v => v));
  });
  if (sh.after) sh.after();
}

function niceMax(m) { if (m <= 0) return 1; const p = 10 ** Math.floor(Math.log10(m)); for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= m) return f * p; return 10 * p; }
const kShort = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n % 1000 ? 1 : 0).replace('.0', '') + 'k' : String(Math.round(n));
function barChart(items, series) {
  const W = 640, H = 220, padL = 44, padB = 26, padT = 10;
  const max = niceMax(Math.max(1, ...items.flatMap(it => series.map(s => it[s.k]))));
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const step = (W - padL - 8) / Math.max(1, items.length);
  const bw = Math.min(22, step / (series.length + 1));
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; g += `<line x1="${padL}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${padL - 6}" y="${y(v) + 4}" font-size="10.5" text-anchor="end" fill="var(--muted)">K ${kShort(v)}</text>`; }
  items.forEach((it, i) => {
    const cx = padL + i * step + step / 2;
    series.forEach((s, j) => {
      const x = cx - (series.length * bw) / 2 + j * bw;
      const v = it[s.k];
      if (v > 0) g += `<rect x="${x + 1}" y="${y(v)}" width="${bw - 2}" height="${y(0) - y(v)}" rx="2" fill="${s.color}"><title>${s.label}: ${K0(v)}</title></rect>`;
    });
    g += `<text x="${cx}" y="${H - 8}" font-size="11" text-anchor="middle" fill="var(--muted)">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}</svg>
    <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>`;
}

  </div>
  <div class="result"><span>Result for ${monthName(selMonth)} (money in − money out)</span><b class="${m.net >= 0 ? 'c-in' : 'c-out'}">${m.net < 0 ? '− ' : ''}${K0(Math.abs(m.net))}</b></div>
  <div class="grid g-kpi">
    <a class="card kpi" href="#stock" style="text-decoration:none;color:inherit"><span class="label">Gold in stock now</span><span class="value">${G(st.now)}</span><span class="note">Updates itself after every sale</span></a>
    <a class="card kpi" href="#balances" style="text-decoration:none;color:inherit"><span class="label">Customers still owe us</span><span class="value c-out">${K0(owe)}</span><span class="note">Open advances</span></a>
    <a class="card kpi" href="#mercury" style="text-decoration:none;color:inherit"><span class="label">Mercury this month</span><span class="value">${G(sum(merc, r => num(r.grams)))}</span><span class="note">${top ? `Most used by ${esc(top[0])} (${Math.round(top[1] / Math.max(1, sum(merc, r => num(r.grams))) * 100)}%)` : 'No mercury used'}</span></a>
  </div>
  <div class="card chart"><h2>Last 8 weeks<a class="link" href="#report-week">Weekly report →</a></h2>
    ${barChart(wk, [{ k: 'inn', label: 'Money in', color: 'var(--in)' }, { k: 'out', label: 'Money out (without salaries)', color: 'var(--out)' }])}</div>`;
};

V.sales = () => head('Sales sheet', 'Every sale of gold. Gold sold here is taken off the stock automatically.') + sheetBlock('sales', 'Add sale');

function periodReport(kind) {
  const keyOf = d => kind === 'week' ? monday(d) : d.slice(0, 7);
  const keys = [...new Set([...S.sales, ...S.expenses, ...S.intake, ...S.advances, ...S.mercury].map(r => r.date).filter(Boolean).map(keyOf))].sort();
  const rows = keys.map(k => {
    const mm = money(d => d && keyOf(d) === k, kind === 'month');
    const s = S.sales.filter(r => r.date && keyOf(r.date) === k);
    return { k, label: kind === 'week' ? 'Week of ' + dshort(k) : monthName(k), short: kind === 'week' ? dshort(k) : monthName(k).split(' ')[0].slice(0, 3), count: s.length, grams: sum(s, r => num(r.grams)), ...mm };
  });
  const recent = kind === 'week' ? rows.slice(-10) : rows;
  return `<div class="card chart"><h2>Sales per ${kind}</h2>${barChart(recent.map(r => ({ label: r.short, inn: r.sales, out: r.out })), [{ k: 'inn', label: 'Sales (money in)', color: 'var(--in)' }, { k: 'out', label: kind === 'week' ? 'Money out (without salaries)' : 'Money out', color: 'var(--out)' }])}</div>
  <div class="card">${dataTable([
    { h: kind === 'week' ? 'Week' : 'Month', f: r => r.label }, { h: 'Sales', num: 1, f: r => r.count }, { h: 'Gold sold', num: 1, f: r => G(r.grams) },
    { h: 'Money in', num: 1, f: r => `<span class="c-in">${K0(r.sales)}</span>` }, { h: 'Money out', num: 1, f: r => `<span class="c-out">${K0(r.out)}</span>` },
    { h: 'Result', num: 1, f: r => `<b class="${r.net >= 0 ? 'c-in' : 'c-out'}">${r.net < 0 ? '− ' : ''}${K0(Math.abs(r.net))}</b>` }
  ], [...rows].reverse(), ['Total', sum(rows, r => r.count), G(sum(rows, r => r.grams)), K0(sum(rows, r => r.sales)), K0(sum(rows, r => r.out)), K0(sum(rows, r => r.net))])}
  ${kind === 'week' ? '<p class="note" style="margin:10px 0 0">Salaries are paid monthly, so they are counted in the monthly report only.</p>' : ''}</div>`;
}
V['report-week'] = () => head('Weekly report', 'Sales and costs per week (Monday to Sunday). Calculated from the sheets, nothing to type here.') + periodReport('week');
V['report-month'] = () => head('Monthly report', 'Sales and costs per month, including salaries.') + periodReport('month');

V.expenses = () => head('Daily expenses', 'Food, fuel, gas, transport, repairs and other daily costs.') + sheetBlock('expenses', 'Add expense');

V.mercury = () => head('Mercury use', 'Write down how much mercury each machine uses. The cost and the machine that uses the most are calculated automatically.') + `
  <div class="grid g-2" id="mercSummary"></div>` + sheetBlock('mercury', 'Add mercury use');
function renderMercurySummary() {
  const host = document.getElementById('mercSummary'); if (!host) return;
  const total = sum(S.mercury, r => num(r.grams));
  const per = {}, perUse = {};
  S.mercury.forEach(r => { per[r.machine || '?'] = (per[r.machine || '?'] || 0) + num(r.grams); perUse[r.use || 'Other'] = (perUse[r.use || 'Other'] || 0) + num(r.grams); });
  const list = Object.entries(per).sort((a, b) => b[1] - a[1]);
  const uses = Object.entries(perUse).sort((a, b) => b[1] - a[1]);
  const name = no => (S.machines.find(m => norm(m.no) === norm(no)) || {}).name || '';
  host.innerHTML = `<div class="card"><h2>Per machine</h2>
    ${list.length ? `<div class="callout" style="margin-bottom:12px">${esc(list[0][0])} ${esc(name(list[0][0]))} uses the most mercury: ${Math.round(list[0][1] / Math.max(1, total) * 100)}% of all.</div>` : ''}
    <div class="lines">${list.map(([no, g]) => `<div class="line"><span>${esc(no)} · ${esc(name(no))}</span><span class="v">${G(g)} · ${K0(g * num(S.settings.mercuryPrice))}</span><div class="track"><div class="fill" style="width:${g / Math.max(1, list[0][1]) * 100}%"></div></div></div>`).join('')}</div></div>
    <div class="card"><h2>Where it goes</h2><div class="lines">${uses.map(([u, g]) => `<div class="line"><span>${esc(u)}</span><span class="v">${Math.round(g / Math.max(1, total) * 100)}%</span><div class="track"><div class="fill out" style="width:${g / Math.max(1, total) * 100}%"></div></div></div>`).join('')}</div>
    <p class="note" style="margin:12px 0 0">Total ${G(total)} · ${K(total * num(S.settings.mercuryPrice))} at ${K(num(S.settings.mercuryPrice))} per gram</p></div>`;
}

V.salaries = () => head('Salaries', 'Monthly salary and days off per employee.') + sheetBlock('salaries', 'Add employee');

V.advances = () => head('Advances given', 'Money paid to a customer before they bring gold. It is taken off automatically the next time they bring gold.') + sheetBlock('advances', 'Add advance');

V.intake = () => head('Gold brought in', 'A customer brings gold. The open advance, transport and machine cost are taken off, and you see what to pay.') + `
  <div class="legend-row"><span><i style="background:var(--surface)"></i>You type</span><span><i style="background:var(--calc)"></i>Calculated</span>
  <span>Pay to customer = gold value − advance before − transport − machine cost</span></div>` + sheetBlock('intake', 'Add gold brought in');

V.balances = () => {
  const { rows, bal } = deriveIntake();
  const names = {};
  [...S.advances.map(r => r.customer), ...S.intake.map(r => r.customer)].forEach(n => { if (String(n || '').trim()) names[norm(n)] = n.trim(); });
  const list = Object.keys(names).map(k => ({
    name: names[k],
    adv: sum(S.advances.filter(r => norm(r.customer) === k), r => num(r.amount)),
    grams: sum(S.intake.filter(r => norm(r.customer) === k), r => num(r.grams)),
    paid: sum(S.intake.map((r, i) => ({ r, d: rows[i] })).filter(x => norm(x.r.customer) === k), x => Math.max(0, x.d ? x.d.pay : 0)),
    owe: bal[k] || 0
  })).sort((a, b) => b.owe - a.owe);
  return head('Customer balances', 'Per customer: advances given, gold brought, money paid and what they still owe. Calculated automatically.') +
    `<div class="card">${dataTable([
      { h: 'Customer', f: r => `<b>${esc(r.name)}</b>` }, { h: 'Advances given', num: 1, f: r => K0(r.adv) }, { h: 'Gold brought', num: 1, f: r => G(r.grams) },
      { h: 'Paid for gold', num: 1, f: r => K0(r.paid) }, { h: 'Still owes us', num: 1, f: r => r.owe > 0 ? chip(K0(r.owe), 'out') : chip('Nothing', 'in') }
    ], list, ['Total', K0(sum(list, r => r.adv)), G(sum(list, r => r.grams)), K0(sum(list, r => r.paid)), K0(sum(list, r => r.owe))])}</div>`;
};

V.stock = () => {
  const st = stockMoves();
  const inn = sum(st.moves, m => m.inn), out = sum(st.moves, m => m.out);
  return head('Gold in stock', 'Comes automatically from "Gold brought in" (stock goes up) and the "Sales sheet" (stock goes down). Nothing to type here.') + `
  <div class="grid g-kpi">
    <div class="card kpi"><span class="label">Available now</span><span class="value">${G(st.now)}</span><span class="note">Worth about ${K0(st.now * num(S.settings.sellPrice))} at today's selling price</span></div>
    <div class="card kpi"><span class="label">Brought in by customers</span><span class="value c-in">+ ${G(inn)}</span></div>
    <div class="card kpi"><span class="label">Sold</span><span class="value c-out">− ${G(out)}</span></div>
    <div class="card kpi"><span class="label">Opening stock</span><span class="value">${G(num(S.settings.opening))}</span><span class="note">Change in Setup</span></div>
  </div>
  <div class="card"><h2>Every movement</h2>${dataTable([
    { h: 'Date', f: r => dshort(r.date) }, { h: 'What', f: r => chip(r.what, r.inn ? 'in' : 'out') }, { h: 'Customer / buyer', f: r => esc(r.who) },
    { h: 'In', num: 1, f: r => r.inn ? `<span class="c-in">+ ${G(r.inn)}</span>` : '' }, { h: 'Out', num: 1, f: r => r.out ? `<span class="c-out">− ${G(r.out)}</span>` : '' },
    { h: 'Stock after', num: 1, f: r => `<b>${G(r.bal)}</b>` }
  ], [...st.moves].reverse())}</div>`;
};

V.prices = () => {
  const f = (k, label, help, step = '0.01') => `<div class="field"><label for="set-${k}">${label}</label><input id="set-${k}" data-set="${k}" inputmode="decimal" value="${esc(S.settings[k])}"><small>${help}</small></div>`;
  return head('Prices and fixed costs', 'Change these when prices move. New rows use these values; old rows keep their own price.') + `
  <div class="card" style="max-width:760px"><div class="form">
    ${f('buyPrice', 'Buying price per gram (K)', 'Used when a customer brings gold')}
    ${f('sellPrice', 'Selling price per gram (K)', 'Used for new sales')}
    ${f('transport', 'Transport, fixed amount (K)', 'Taken off every time gold is brought in')}
    ${f('mercuryPrice', 'Mercury price per gram (K)', 'Used to calculate mercury cost')}
    ${f('opening', 'Opening gold stock (g)', 'Gold you already had before using this website')}
  </div></div>
  <div class="card" style="max-width:760px"><h2>Test data</h2><p class="note" style="margin:0 0 12px">Everything you type is saved in this browser only. This button puts the example data back.</p>
  <button class="btn" id="resetBtn">Reset example data</button></div>`;
};
V.machines = () => head('Machines', 'Each machine has a number and a fixed cost. The fixed cost is taken off when gold goes through that machine.') + sheetBlock('machines', 'Add machine');

// ================= Router =================
const label = {};
NAV.forEach(n => n.children ? n.children.forEach(c => label[c.id] = [n.label, c.label]) : label[n.id] = [null, n.label]);
const openGroups = new Set();
function renderNav(active) {
  document.getElementById('nav').innerHTML = NAV.map((n, gi) => {
    if (!n.children) return `<a class="nav-item ${active === n.id ? 'active' : ''}" href="#${n.id}">${svg(I[n.icon])}${n.label}</a>`;
    const open = openGroups.has(gi);
    return `<div class="nav-group ${open ? 'open' : ''}"><button data-group="${gi}" aria-expanded="${open}">${svg(I[n.icon])}${n.label}${svg(I.chev, 'chev')}</button>
      <div class="sub">${n.children.map(c => `<a href="#${c.id}" class="${active === c.id ? 'active' : ''}">${c.label}</a>`).join('')}</div></div>`;
  }).join('');
}
function currentId() { const h = location.hash.slice(1); return V[h] ? h : 'dashboard'; }
function route() {
  const id = currentId();
  NAV.forEach((n, gi) => { if (n.children && n.children.some(c => c.id === id)) openGroups.add(gi); });
  renderNav(id);
  const [grp, name] = label[id];
  document.getElementById('crumb').innerHTML = grp ? `${grp} / <b>${name}</b>` : `<b>${name}</b>`;
  document.getElementById('view').innerHTML = V[id]();
  if (SHEETS[id]) mountSheet(id);
  if (id === 'mercury') renderMercurySummary();
  document.getElementById('app').classList.remove('menu-open');
  window.scrollTo(0, 0);
}

let toastTimer;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2400); }

// ================= Events =================
function onCellChange(e) {
  const t = e.target;
  const table = t.closest('table.sheet');
  if (table && t.dataset.k !== undefined) {
    const key = table.dataset.sheet;
    const row = S[key][+t.dataset.r];
    const col = SHEETS[key].cols.find(c => c.k === t.dataset.k);
    row[t.dataset.k] = col.t === 'num' ? (t.value.trim() === '' ? '' : num(t.value)) : t.value;
    persist();
    refreshSheet(key);
    return;
  }
  if (t.dataset.set) { S.settings[t.dataset.set] = num(t.value); persist(); return; }
  if (t.id === 'monthSel') { selMonth = t.value; route(); }
}
document.addEventListener('input', e => { if (e.target.closest('table.sheet') || e.target.dataset.set) onCellChange(e); });
document.addEventListener('change', onCellChange);
document.addEventListener('focusout', e => { if (e.target.closest('table.sheet')) renderLists(); });

document.addEventListener('keydown', e => {
  const t = e.target, table = t.closest && t.closest('table.sheet');
  if (!table || t.dataset.k === undefined) return;
  const isSelect = t.tagName === 'SELECT';
  let d = 0;
  if (e.key === 'Enter') d = e.shiftKey ? -1 : 1;
  else if (!isSelect && e.key === 'ArrowDown') d = 1;
  else if (!isSelect && e.key === 'ArrowUp') d = -1;
  if (!d) return;
  e.preventDefault();
  const key = table.dataset.sheet, r = +t.dataset.r + d, k = t.dataset.k;
  const next = table.querySelector(`[data-r="${r}"][data-k="${k}"]`);
  if (next) next.focus();
  else if (d > 0) addRow(key, k);
});

document.addEventListener('click', e => {
  const g = e.target.closest('[data-group]');
  if (g) { const i = +g.dataset.group; openGroups.has(i) ? openGroups.delete(i) : openGroups.add(i); renderNav(currentId()); return; }
  const add = e.target.closest('[data-add]');
  if (add) { addRow(add.dataset.add); return; }
  const del = e.target.closest('[data-del]');
  if (del) { const key = del.closest('table.sheet').dataset.sheet; S[key].splice(+del.dataset.del, 1); persist(); mountSheet(key); toast('Row deleted'); return; }
  if (e.target.id === 'resetBtn') { S = JSON.parse(JSON.stringify(EXAMPLE)); persist(); selMonth = null; route(); toast('Example data is back'); }
});
document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('app').classList.add('menu-open'));
document.getElementById('scrim').addEventListener('click', () => document.getElementById('app').classList.remove('menu-open'));
window.addEventListener('hashchange', route);
renderLists();
route();
</script>

</html>
