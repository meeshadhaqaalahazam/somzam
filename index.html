<style>
/* Layout: fixed left sidebar with collapsible groups, content area with page header + cards. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --surface-2: #eceee9;
  --line: #d9dcd4;
  --fg: #1d221f;
  --muted: #5f675f;
  --side-bg: #1f2a26;
  --side-fg: #c9d2cc;
  --side-hover: #2b3833;
  --side-active: #34443e;
  --accent: #b7791f;      /* ore gold */
  --accent-soft: #f4e6cc;
  --good: #2f7d4f;
  --good-soft: #dcefe2;
  --warn: #a8641a;
  --warn-soft: #f6e5cf;
  --bad: #b23a32;
  --bad-soft: #f6dcd9;
  --chart-a: #b7791f;
  --chart-b: #3e6b5c;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --surface: #1c2320; --surface-2: #232b28; --line: #313b37; --fg: #e6ebe7; --muted: #9aa59e;
    --side-bg: #101513; --side-fg: #b9c4bd; --side-hover: #1d2522; --side-active: #27322e;
    --accent: #e0a446; --accent-soft: #3b2f1c; --good: #6cc08d; --good-soft: #1d3326; --warn: #e3a35a; --warn-soft: #3a2c1b;
    --bad: #ec7d74; --bad-soft: #3d2220; --chart-a: #e0a446; --chart-b: #79b5a1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1c2320; --surface-2: #232b28; --line: #313b37; --fg: #e6ebe7; --muted: #9aa59e;
  --side-bg: #101513; --side-fg: #b9c4bd; --side-hover: #1d2522; --side-active: #27322e;
  --accent: #e0a446; --accent-soft: #3b2f1c; --good: #6cc08d; --good-soft: #1d3326; --warn: #e3a35a; --warn-soft: #3a2c1b;
  --bad: #ec7d74; --bad-soft: #3d2220; --chart-a: #e0a446; --chart-b: #79b5a1; color-scheme: dark;

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
.app { display: flex; min-height: 100%; }

/* Sidebar */
.side { width: 248px; flex-shrink: 0; background: var(--side-bg); color: var(--side-fg); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding-left: env(safe-area-inset-left, 0px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #1a1408; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 17px; color: #fff; letter-spacing: .01em; }
.brand-sub { font-size: 11px; color: var(--side-fg); opacity: .7; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px 20px; }
.nav-item, .nav-group > button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; color: var(--side-fg);
  padding: 10px 10px; border-radius: 7px; cursor: pointer; text-align: left; font-weight: 500; text-decoration: none; }
.nav-item:hover, .nav-group > button:hover { background: var(--side-hover); color: #fff; }
.nav-item:focus-visible, .nav-group > button:focus-visible, .sub a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.nav-item.active, .nav-group.open > button { color: #fff; }
.nav-item.active { background: var(--side-active); }
.nav svg { width: 18px; height: 18px; flex-shrink: 0; }
.chev { margin-left: auto; transition: transform .15s; opacity: .6; width: 14px !important; height: 14px !important; }
.nav-group.open .chev { transform: rotate(90deg); }
.sub { display: none; flex-direction: column; gap: 1px; padding: 2px 0 6px 39px; }
.nav-group.open .sub { display: flex; }
.sub a { color: var(--side-fg); text-decoration: none; padding: 7px 10px; border-radius: 6px; font-size: 13.5px; }
.sub a:hover { background: var(--side-hover); color: #fff; }
.sub a.active { color: #fff; background: var(--side-active); box-shadow: inset 2px 0 0 var(--accent); }
.side-foot { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--side-hover); font-size: 12px; display: flex; gap: 10px; align-items: center; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--side-active); display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 12px; }

/* Main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 8px; cursor: pointer; }
.crumb { color: var(--muted); font-size: 13px; }
.crumb b { color: var(--fg); font-weight: 600; }
.topbar .spacer { flex: 1; }
.example-pill { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--warn); font-weight: 600; letter-spacing: .02em; }
.content { padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1200px; width: 100%; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.page-head h1 { font-family: var(--f-display); font-size: 24px; font-weight: 700; margin: 0; text-wrap: balance; }
.page-head p { margin: 2px 0 0; color: var(--muted); }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1408; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { font-family: var(--f-display); font-size: 15px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.card h2 .link { margin-left: auto; font-family: var(--f-body); font-size: 12.5px; font-weight: 500; color: var(--accent); text-decoration: none; }
.grid { display: grid; gap: 14px; }
.g-kpi { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.g-2 { grid-template-columns: 2fr 1fr; }
.g-2e { grid-template-columns: 1fr 1fr; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; }
.kpi .value { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .note { font-size: 12.5px; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-size: 13px; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.neutral { background: var(--surface-2); color: var(--muted); }

.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.alert .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.alert small { display: block; color: var(--muted); }

.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
.bar-row .track { grid-column: 1 / -1; height: 9px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--chart-b); border-radius: 99px; }
.bar-row .fill.gold { background: var(--chart-a); }
.bar-row .v { font-family: var(--f-mono); font-size: 13px; }

.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; min-width: 0; }
.field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.calc { display: flex; flex-direction: column; gap: 0; }
.calc-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--line); gap: 10px; }
.calc-row span:last-child { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.calc-row.total { border-bottom: 0; padding-top: 14px; font-weight: 700; font-size: 18px; }
.calc-row.total span:last-child { color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.filters button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 8px; font-weight: 500; z-index: 30; }
.scrim { display: none; }

@media (max-width: 900px) {
  .g-2, .g-2e { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .side { position: fixed; left: 0; top: 0; bottom: 0; height: 100%; z-index: 20; transform: translateX(-100%); transition: transform .2s;
    padding-top: env(safe-area-inset-top, 0px); }
  .app.menu-open .side { transform: none; }
  .app.menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 15; }
  .menu-btn { display: inline-flex; }
  .form { grid-template-columns: 1fr; }
  .example-pill { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  </div>`;
function buyCalc() {
  const s = suppliers.find(x => x.id === document.getElementById('b-sup').value);
  const gross = +document.getElementById('b-gross').value || 0;
  const ded = +document.getElementById('b-ded').value || 0;
  const price = +document.getElementById('b-price').value || 0;
  const net = gross * (1 - ded / 100);
  const total = net * price;
  const useAdv = document.getElementById('b-adv').checked;
  const advDeduct = useAdv ? Math.min(s.open, total) : 0;
  const row = (a, b) => `<div class="calc-row"><span>${a}</span><span>${b}</span></div>`;
  document.getElementById('buyCalc').innerHTML =
    row('Gross weight', kg(gross)) + row(`Deduction (${ded}%)`, '− ' + kg(gross - net)) + row('Net weight', kg(net)) +
    row('Price per kg', usd2(price)) + row('Purchase amount', usd2(total)) +
    row(`Open advances (${s.name})`, usd2(s.open)) + row('Deducted now', '− ' + usd2(advDeduct)) +
    (useAdv && s.open > total ? row('Advance still open after this', usd2(s.open - total)) : '') +
    `<div class="calc-row total"><span>Pay to supplier</span><span>${usd2(total - advDeduct)}</span></div>`;
}

// ---------- Router ----------
const label = {};
NAV.forEach(n => n.children ? n.children.forEach(c => label[c.id] = [n.label, c.label]) : label[n.id] = [null, n.label]);
const openGroups = new Set();

function renderNav(active) {
  document.getElementById('nav').innerHTML = NAV.map((n, gi) => {
    if (!n.children) return `<a class="nav-item ${active === n.id ? 'active' : ''}" href="#${n.id}">${svg(I[n.icon])}${n.label}</a>`;
    const open = openGroups.has(gi);
    return `<div class="nav-group ${open ? 'open' : ''}"><button data-group="${gi}" aria-expanded="${open}">${svg(I[n.icon])}${n.label}${svg(I.chev, 'chev')}</button>
      <div class="sub">${n.children.map(c => `<a href="#${c.id}" class="${active === c.id ? 'active' : ''}">${c.label}</a>`).join('')}</div></div>`;
  }).join('');
}

function route() {
  const id = V[location.hash.slice(1)] ? location.hash.slice(1) : 'dashboard';
  NAV.forEach((n, gi) => { if (n.children && n.children.some(c => c.id === id)) openGroups.add(gi); });
  renderNav(id);
  const [grp, name] = label[id];
  document.getElementById('crumb').innerHTML = grp ? `${grp} / <b>${name}</b>` : `<b>${name}</b>`;
  document.getElementById('view').innerHTML = V[id]();
  document.getElementById('app').classList.remove('menu-open');
  if (id === 'purchase-new') { buyCalc(); document.getElementById('buyForm').addEventListener('input', buyCalc); }
  if (id === 'sale-new') {
    const f = () => { document.getElementById('s-total').value = usd2((+document.getElementById('s-qty').value || 0) * (+document.getElementById('s-price').value || 0)); };
    f(); document.getElementById('saleForm').addEventListener('input', f);
  }
  window.scrollTo(0, 0);
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg + ' (example only, nothing stored)';
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2400);
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-group]');
  if (g) { const i = +g.dataset.group; openGroups.has(i) ? openGroups.delete(i) : openGroups.add(i); renderNav(location.hash.slice(1) || 'dashboard'); return; }
  const go = e.target.closest('[data-go]');
  if (go) { location.hash = go.dataset.go; return; }
  const s = e.target.closest('[data-save]');
  if (s) { e.preventDefault(); toast(s.dataset.save); return; }
  const c = e.target.closest('[data-cat]');
  if (c) { expFilter = c.dataset.cat; route(); return; }
});
document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('app').classList.add('menu-open'));
document.getElementById('scrim').addEventListener('click', () => document.getElementById('app').classList.remove('menu-open'));
document.addEventListener('submit', e => e.preventDefault());
window.addEventListener('hashchange', route);
route();
</script>
