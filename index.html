<style>
/* Layout: left sidebar with collapsible groups; content = page header + spreadsheet-style sheets and summary cards. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --surface-2: #eceee9; --line: #d9dcd4; --grid: #d3d7cf; --head: #e3e8df; --calc: #f6f7f3;
  --fg: #1d221f; --muted: #5f675f;
  --side-bg: #1f2a26; --side-fg: #c9d2cc; --side-hover: #2b3833; --side-active: #34443e;
  --accent: #b7791f; --accent-soft: #f4e6cc;
  --in: #2f7d4f; --in-soft: #dcefe2; --out: #b23a32; --out-soft: #f6dcd9; --warn: #a8641a; --warn-soft: #f6e5cf;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --surface: #1c2320; --surface-2: #232b28; --line: #313b37; --grid: #34403b; --head: #26302c; --calc: #19201d;
    --fg: #e6ebe7; --muted: #9aa59e; --side-bg: #101513; --side-fg: #b9c4bd; --side-hover: #1d2522; --side-active: #27322e;
    --accent: #e0a446; --accent-soft: #3b2f1c; --in: #6cc08d; --in-soft: #1d3326; --out: #ec7d74; --out-soft: #3d2220; --warn: #e3a35a; --warn-soft: #3a2c1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1c2320; --surface-2: #232b28; --line: #313b37; --grid: #34403b; --head: #26302c; --calc: #19201d;
  --fg: #e6ebe7; --muted: #9aa59e; --side-bg: #101513; --side-fg: #b9c4bd; --side-hover: #1d2522; --side-active: #27322e;
  --accent: #e0a446; --accent-soft: #3b2f1c; --in: #6cc08d; --in-soft: #1d3326; --out: #ec7d74; --out-soft: #3d2220; --warn: #e3a35a; --warn-soft: #3a2c1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
.app { display: flex; min-height: 100%; }

/* Sidebar */
.side { width: 250px; flex-shrink: 0; background: var(--side-bg); color: var(--side-fg); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding-left: env(safe-area-inset-left, 0px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #1a1408; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 17px; color: #fff; }
.brand-sub { font-size: 11px; opacity: .7; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px 20px; }
.nav-item, .nav-group > button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; color: var(--side-fg);
  padding: 10px; border-radius: 7px; cursor: pointer; text-align: left; font-weight: 500; text-decoration: none; }
.nav-item:hover, .nav-group > button:hover { background: var(--side-hover); color: #fff; }
.nav-item:focus-visible, .nav-group > button:focus-visible, .sub a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.nav-item.active { background: var(--side-active); color: #fff; }
.nav-group.open > button { color: #fff; }
.nav svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav .tag { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 99px; margin-left: 2px; }
.tag.in { background: var(--in); color: #fff; } .tag.out { background: var(--out); color: #fff; }
.chev { margin-left: auto; transition: transform .15s; opacity: .6; width: 14px !important; height: 14px !important; }
.nav-group.open .chev { transform: rotate(90deg); }
.sub { display: none; flex-direction: column; gap: 1px; padding: 2px 0 6px 39px; }
.nav-group.open .sub { display: flex; }
.sub a { color: var(--side-fg); text-decoration: none; padding: 7px 10px; border-radius: 6px; font-size: 13.5px; }
.sub a:hover { background: var(--side-hover); color: #fff; }
.sub a.active { color: #fff; background: var(--side-active); box-shadow: inset 2px 0 0 var(--accent); }
.side-foot { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--side-hover); font-size: 12px; opacity: .8; }

/* Main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 8px; cursor: pointer; }
.crumb { color: var(--muted); font-size: 13px; min-width: 0; }
.crumb b { color: var(--fg); font-weight: 600; }
.spacer { flex: 1; }
.test-pill { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--warn); font-weight: 600; white-space: nowrap; }
.content { padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1240px; width: 100%; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.page-head h1 { font-family: var(--f-display); font-size: 24px; font-weight: 700; margin: 0; text-wrap: balance; }
.page-head p { margin: 2px 0 0; color: var(--muted); max-width: 70ch; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1408; font-weight: 600; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select.btn { padding-right: 10px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { font-family: var(--f-display); font-size: 15px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h2 .link { margin-left: auto; font-family: var(--f-body); font-size: 12.5px; font-weight: 500; color: var(--accent); text-decoration: none; }
.grid { display: grid; gap: 14px; }
.g-kpi { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.g-2 { grid-template-columns: 2fr 1fr; }
.g-2e { grid-template-columns: 1fr 1fr; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; }
.value { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--muted); }
.c-in { color: var(--in); } .c-out { color: var(--out); }

/* Big money in / out cards */
.big { display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: inherit; border-width: 1px; transition: border-color .15s; }
.big:hover { border-color: var(--muted); }
.big .top { display: flex; align-items: center; gap: 10px; }
.big .ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; }
.big.in .ic { background: var(--in-soft); color: var(--in); } .big.out .ic { background: var(--out-soft); color: var(--out); }
.big .ic svg { width: 20px; height: 20px; }
.big .title { font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.big .amount { font-family: var(--f-display); font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.big.in .amount { color: var(--in); } .big.out .amount { color: var(--out); }
.big .open { margin-left: auto; font-size: 12.5px; color: var(--accent); font-weight: 500; }

.lines { display: flex; flex-direction: column; gap: 9px; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 13.5px; }
.line .v { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.line .track { grid-column: 1 / -1; height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.line .fill { height: 100%; border-radius: 99px; background: var(--accent); }
.line .fill.in { background: var(--in); } .line .fill.out { background: var(--out); }
.result { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); gap: 10px; flex-wrap: wrap; }
.result b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }

/* Read-only data tables */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.data th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
table.data .num { text-align: right; font-family: var(--f-mono); font-size: 13px; }
table.data tfoot td { font-weight: 700; border-top: 2px solid var(--line); }
.chip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.chip.in { background: var(--in-soft); color: var(--in); } .chip.out { background: var(--out-soft); color: var(--out); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.neutral { background: var(--surface-2); color: var(--muted); }

/* Spreadsheet */
.sheet-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sheet-tools .hint { color: var(--muted); font-size: 12.5px; margin-left: auto; }
.sheet-wrap { overflow: auto; border: 1px solid var(--grid); border-radius: 6px; background: var(--surface); max-height: 70vh; }
table.sheet { border-collapse: collapse; width: max-content; min-width: 100%; font-variant-numeric: tabular-nums; }
.sheet th, .sheet td { border: 1px solid var(--grid); padding: 0; height: 31px; white-space: nowrap; }
.sheet thead th { position: sticky; z-index: 2; }
.sheet .letters th { top: 0; height: 22px; background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 500; text-align: center; }
.sheet .names th { top: 22px; background: var(--head); font-weight: 600; font-size: 12.5px; padding: 0 8px; text-align: left; }
.sheet .names th.r, .sheet td.calc { text-align: right; }
.sheet .rn { width: 40px; min-width: 40px; background: var(--surface-2); color: var(--muted); text-align: center; font-size: 11.5px; position: relative; }
.sheet .rn button { display: none; position: absolute; inset: 3px; border: 0; border-radius: 4px; background: var(--out-soft); color: var(--out); cursor: pointer; font-weight: 700; }
.sheet tr:hover .rn button, .sheet .rn button:focus-visible { display: block; }
.sheet input, .sheet select { width: 100%; height: 31px; border: 0; background: transparent; padding: 0 8px; outline: none; font-size: 13.5px; border-radius: 0; }
.sheet input.n { text-align: right; font-family: var(--f-mono); font-size: 13px; }
.sheet td:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; position: relative; z-index: 1; background: var(--surface); }
.sheet td.calc { background: var(--calc); padding: 0 8px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.sheet td.calc.strong { color: var(--fg); font-weight: 600; }
.sheet td.calc.owe { color: var(--out); font-weight: 600; }
.sheet tfoot td { font-weight: 700; background: var(--surface-2); padding: 0 8px; position: sticky; bottom: 0; }
.sheet tfoot td.num { text-align: right; font-family: var(--f-mono); font-size: 13px; }
.legend-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend-row i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--grid); vertical-align: -2px; margin-right: 5px; border-radius: 2px; }

/* Settings form */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; min-width: 0; font-family: var(--f-mono); }
.field input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.field small { color: var(--muted); }

.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.callout { padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--fg); font-size: 13.5px; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 8px; font-weight: 500; z-index: 30; }
.scrim { display: none; }

@media (max-width: 900px) { .g-2, .g-2e { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .side { position: fixed; left: 0; top: 0; bottom: 0; height: 100%; z-index: 20; transform: translateX(-100%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
  .app.menu-open .side { transform: none; }
  .app.menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 15; }
  .menu-btn { display: inline-flex; }
  .form { grid-template-columns: 1fr; }
  .test-pill { display: none; }
  .big .amount { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.sheet input:disabled, .sheet select:disabled { color: var(--fg); opacity: .7; cursor: not-allowed; -webkit-text-fill-color: var(--fg); }
.field input:disabled { opacity: .7; cursor: not-allowed; }
.sheet td.by { font-size: 12px; color: var(--muted); white-space: nowrap; }
[hidden] { display: none !important; }
#login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); }
.login-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
.login-card h1 { margin: 0; font-size: 22px; }
.user-box { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
.user-box .btn { padding: 5px 10px; font-size: 12.5px; }
.test-pill.ok { background: var(--in-soft); color: var(--in); } .test-pill.bad { background: var(--out-soft); color: var(--out); }
@media (max-width: 760px) { .user-box .who { display: none; } .test-pill.bad { display: inline-block; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<div class="app" id="app">
  <aside class="side" aria-label="Main menu">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-11 4 6 3-4 5 9z"/></svg></div>

</div>
<div id="lists"></div>
<div class="toast" id="toast" hidden></div>

<script>
// ================= Online database (Supabase) =================
// Fill in the Project URL and the anon / publishable key from Supabase → Project Settings → API.
// Left empty, SomZam saves in this browser only.
const SUPABASE_URL = 'https://eipadrhqxbwnldbguzhj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3bS1n6hbNvcvbZOUv6UHoQ_iDiSBsH3';
const CLOUD = !!(SUPABASE_URL && SUPABASE_KEY);
const sb = CLOUD && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let me = null, people = {};
const isOwner = () => !CLOUD || (me && me.role === 'owner');
const STAFF_SHEETS = new Set(['sales', 'expenses', 'intake', 'advances', 'milkBought', 'machineMilk']);
const canAdd = key => isOwner() || STAFF_SHEETS.has(key);
const canEdit = (key, row) => isOwner() || (STAFF_SHEETS.has(key) && me && row._by === me.id);
const personName = id => { const p = people[id]; return p ? (p.name || String(p.email || '').split('@')[0]) : ''; };

// ================= Icons & navigation =================
const I = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  flag: '<path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/>',
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/>',
  in: '<path d="M12 21V9M7 14l5-5 5 5"/><path d="M4 3h16"/>',
  out: '<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/>',
  adv: '<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  stock: '<path d="M4 18l3-8h10l3 8z"/><path d="M8 10l2-5h4l2 5"/>',
  cog: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  chev: '<path d="M9 6l6 6-6 6"/>'
};
const svg = (p, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const NAV = [
  { id: 'dashboard', label: 'Overview', icon: 'home' },
  { id: 'start', label: 'Starting point', icon: 'flag' },
  { id: 'cash', label: 'Cash book', icon: 'cash' },
  { label: 'Money in', tag: 'in', icon: 'in', children: [
    { id: 'sales', label: 'Sales sheet' }, { id: 'report-week', label: 'Weekly report' }, { id: 'report-month', label: 'Monthly report' } ] },
  { label: 'Money out', tag: 'out', icon: 'out', children: [
    { id: 'expenses', label: 'Daily expenses' }, { id: 'salaries', label: 'Salaries' } ] },
  { label: 'Customers', icon: 'adv', children: [
    { id: 'intake', label: 'Minerals brought in' }, { id: 'advances', label: 'Advances given' }, { id: 'balances', label: 'Customer balances' } ] },
  { label: 'Milk', icon: 'drop', children: [ { id: 'milk-machines', label: 'Milk per machine' }, { id: 'milk', label: 'Milk stock' } ] },
  { label: 'Minerals stock', icon: 'stock', children: [ { id: 'stock', label: 'Stock now' } ] },
  { label: 'Setup', icon: 'cog', children: [ { id: 'prices', label: 'Prices and fixed costs' }, { id: 'machines', label: 'Machines' }, { id: 'team', label: 'Team' } ] }
];

// ================= Example data (Zambian kwacha, grams) =================
const EXAMPLE = {
  settings: { buyPrice: 1400, machineCost: 750, transport: '', sellPrice: '', milkPrice: '' },
  start: { date: new Date().toISOString().slice(0, 10), cash: '', milk: '', minerals: '' },
  startAdv: [],
  machines: [1, 2, 3, 4, 5].map(n => ({ no: 'M' + n, name: 'Machine ' + n, startMilk: '' })),
  advances: [],
  intake: [],
  sales: [],
  expenses: [],
  milkBought: [],
  machineMilk: [],
  salaries: []
};

// ================= Calculations =================
// Minerals brought in: value = grams x 1400; minus open advance, transport, machine cost (750) and private payment.
// If the result is below zero, the rest stays as an advance the customer still owes.
function deriveIntake() {
  const events = [];
  S.startAdv.forEach(a => events.push({ date: '', kind: 0, a }));
  S.advances.forEach(a => events.push({ date: a.date || '', kind: 0, a }));
  S.intake.forEach((r, i) => events.push({ date: r.date || '', kind: 1, r, i }));
  events.sort((x, y) => x.date.localeCompare(y.date) || x.kind - y.kind);
  const bal = {}, out = [];
  events.forEach(e => {
    if (e.kind === 0) { const c = norm(e.a.customer); if (c) bal[c] = (bal[c] || 0) + num(e.a.amount); return; }
    const c = norm(e.r.customer);
    const value = num(e.r.grams) * num(e.r.price);
    const adv = bal[c] || 0;
    const tr = num(e.r.transport), mc = num(e.r.mc), pv = num(e.r.priv);
    const pay = value - adv - tr - mc - pv;
    bal[c] = pay < 0 ? -pay : 0;
    out[e.i] = { value, adv, pay, cashOut: Math.max(0, pay) + tr + pv };
  });
  return { rows: out, bal };
}

// Milk per machine: carried from the day before + added from stock − used = balance. Lost = balance − counted left.
// What was counted (or the balance, if nobody counted) carries over to the next day.
function deriveMachineMilk() {
  const carry = {}, lost = {};
  S.machines.forEach(m => { carry[norm(m.no)] = num(m.startMilk); lost[norm(m.no)] = 0; });
  const idx = S.machineMilk.map((r, i) => i).sort((a, b) => String(S.machineMilk[a].date || '').localeCompare(String(S.machineMilk[b].date || '')) || a - b);
  const rows = [];
  idx.forEach(i => {
    const r = S.machineMilk[i], k = norm(r.machine);
    const from = carry[k] || 0, added = num(r.added), used = num(r.used);
    const bal = from + added - used;
    const counted = isBlank(r.left) ? null : num(r.left);
    const l = counted === null ? null : bal - counted;
    carry[k] = counted === null ? bal : counted;
    lost[k] = (lost[k] || 0) + (l || 0);
    rows[i] = { name: machineName(r.machine), from, inn: from + added, bal, lost: l };
  });
  return { rows, now: carry, lost };
}

const deriveRows = {
  intake: () => deriveIntake().rows,
  sales: () => S.sales.map(r => ({ total: num(r.grams) * num(r.price) })),
  machineMilk: () => deriveMachineMilk().rows,
  machines: () => { const d = deriveMachineMilk(); return S.machines.map(m => ({ now: d.now[norm(m.no)] || 0, lost: d.lost[norm(m.no)] || 0 })); }
};

function stockMoves() {
  const mv = [];
  S.intake.forEach(r => { if (num(r.grams)) mv.push({ date: r.date, who: r.customer, inn: num(r.grams), out: 0, what: 'Brought in by customer' }); });
  S.sales.forEach(r => { if (num(r.grams)) mv.push({ date: r.date, who: r.buyer, inn: 0, out: num(r.grams), what: 'Sold' }); });
  mv.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  let bal = num(S.start.minerals);
  mv.forEach(m => { bal += m.inn - m.out; m.bal = bal; });
  return { moves: mv, now: bal };
}

function milkMoves() {
  const mv = [];
  S.milkBought.forEach(r => { if (num(r.grams)) mv.push({ date: r.date, who: r.from, inn: num(r.grams), out: 0, what: 'Bought' }); });
  S.machineMilk.forEach(r => { if (num(r.added)) mv.push({ date: r.date, who: `${r.machine} · ${machineName(r.machine)}`, inn: 0, out: num(r.added), what: 'Given to machine' }); });
  mv.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  let bal = num(S.start.milk);
  mv.forEach(m => { bal += m.inn - m.out; m.bal = bal; });
  return { moves: mv, now: bal };
}

function cashMoves() {
  const d = deriveIntake().rows, mv = [];
  S.sales.forEach(r => { const v = num(r.grams) * num(r.price); if (r.status === 'Paid' && v) mv.push({ date: r.date, what: 'Sale paid', who: r.buyer, inn: v, out: 0 }); });
  S.intake.forEach((r, i) => { const x = d[i]; if (x && x.cashOut) mv.push({ date: r.date, what: 'Minerals bought', who: r.customer, inn: 0, out: x.cashOut }); });
  S.advances.forEach(r => { if (num(r.amount)) mv.push({ date: r.date, what: 'Advance given', who: r.customer, inn: 0, out: num(r.amount) }); });
  S.expenses.forEach(r => { if (num(r.amount)) mv.push({ date: r.date, what: r.category || 'Expense', who: r.desc, inn: 0, out: num(r.amount) }); });
  S.milkBought.forEach(r => { if (num(r.amount)) mv.push({ date: r.date, what: 'Milk bought', who: r.from, inn: 0, out: num(r.amount) }); });
  S.salaries.forEach(r => { if (r.status === 'Paid' && num(r.salary)) mv.push({ date: r.paidOn || todayStr(), what: 'Salary paid', who: r.name, inn: 0, out: num(r.salary) }); });
  mv.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  let bal = num(S.start.cash);
  mv.forEach(m => { bal += m.inn - m.out; m.bal = bal; });
  return { moves: mv, now: bal };
}

// Money in / out for a period filter (date string -> boolean)
function money(inPeriod, withSalaries) {
  const intake = deriveIntake().rows;
  const sales = sum(S.sales.filter(r => inPeriod(r.date)), r => num(r.grams) * num(r.price));
  const minerals = sum(S.intake.map((r, i) => ({ r, d: intake[i] })).filter(x => inPeriod(x.r.date)), x => x.d ? x.d.cashOut : 0);
  const advances = sum(S.advances.filter(r => inPeriod(r.date)), r => num(r.amount));
  const expenses = sum(S.expenses.filter(r => inPeriod(r.date)), r => num(r.amount));
  const milk = sum(S.milkBought.filter(r => inPeriod(r.date)), r => num(r.amount));
  const salaries = withSalaries ? sum(S.salaries, r => num(r.salary)) : 0;
  const out = minerals + advances + expenses + milk + salaries;
  return { sales, minerals, advances, expenses, milk, salaries, out, net: sales - out };
}

const LETTERS = 'ABCDEFGHIJKLMNOP';

function fmtCell(f, v) {
  if (v === undefined || v === null) return '';
  if (f === 'K') return K(v);
  if (f === 'g') return G(v);
  if (f === 'n') return String(Math.round(v * 100) / 100);
  if (f === 'pay') return v < 0 ? 'Still owes ' + K(-v) : K(v);
  if (f === 'lost') return lostText(v);
  return esc(v);
}

function sheetHtml(key) {
  const sh = SHEETS[key], rows = S[key];
  const cols = sh.cols;
  const showBy = CLOUD && key !== 'machines';
  const cell = (c, row, r) => {
    const ro = canEdit(key, row) ? '' : ' disabled';
    if (c.t === 'calc') return `<td class="calc ${c.strong ? 'strong' : ''}" data-calc="${c.k}" data-r="${r}"></td>`;
    if (c.t === 'select') {
      const opts = typeof c.opts === 'function' ? c.opts() : c.opts;
      const all = opts.includes(row[c.k]) || !row[c.k] ? opts : [row[c.k], ...opts];
      return `<td><select${ro} data-r="${r}" data-k="${c.k}" aria-label="${esc(c.h)} row ${r + 1}">${row[c.k] ? '' : '<option></option>'}${all.map(o => `<option${o === row[c.k] ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></td>`;
    }
    const type = c.t === 'date' ? 'date' : 'text';
    return `<td><input${ro} type="${type}" class="${c.t === 'num' ? 'n' : ''}" ${c.t === 'num' ? 'inputmode="decimal"' : ''} ${c.list ? `list="${c.list}"` : ''}
      data-r="${r}" data-k="${c.k}" value="${esc(row[c.k])}" aria-label="${esc(c.h)} row ${r + 1}" autocomplete="off"></td>`;
  };
  const hasTotals = cols.some(c => c.total);
  return `<div class="sheet-wrap"><table class="sheet" data-sheet="${key}">
    <thead><tr class="letters"><th class="rn"></th>${cols.map((c, i) => `<th style="min-width:${c.w}px">${LETTERS[i]}</th>`).join('')}${showBy ? `<th style="min-width:120px">${LETTERS[cols.length]}</th>` : ''}</tr>
    <tr class="names"><th class="rn"></th>${cols.map(c => `<th class="${c.t === 'num' || (c.t === 'calc' && c.f !== 'text') ? 'r' : ''}">${c.h}</th>`).join('')}${showBy ? '<th>Entered by</th>' : ''}</tr></thead>
    <tbody>${rows.map((row, r) => `<tr><td class="rn">${r + 1}${canEdit(key, row) ? `<button type="button" data-del="${r}" aria-label="Delete row ${r + 1}" title="Delete row">×</button>` : ''}</td>${cols.map(c => cell(c, row, r)).join('')}${showBy ? `<td class="calc by">${esc(personName(row._by))}</td>` : ''}</tr>`).join('')}</tbody>
    ${hasTotals ? `<tfoot><tr><td class="rn">Σ</td>${cols.map((c, i) => `<td class="${c.total ? 'num' : ''}" data-total="${c.total ? c.k : ''}">${i === 0 && !c.total ? 'Total' : ''}</td>`).join('')}${showBy ? '<td></td>' : ''}</tr></tfoot>` : ''}
  </table></div>`;
}

function refreshSheet(key) {
  const sh = SHEETS[key];
  document.querySelectorAll(`table.sheet[data-sheet="${key}"]`).forEach(table => {
    const D = deriveRows[key] ? deriveRows[key]() : [];
    table.querySelectorAll('[data-calc]').forEach(td => {
      const c = sh.cols.find(x => x.k === td.dataset.calc);
      const v = (D[+td.dataset.r] || {})[c.k];
      td.textContent = fmtCell(c.f, v).replace(/&amp;/g, '&');
      td.classList.toggle('owe', (c.f === 'pay' && v < 0) || (c.f === 'lost' && v > 0));
    });
    table.querySelectorAll('[data-total]').forEach(td => {
      const k = td.dataset.total; if (!k) return;
      const c = sh.cols.find(x => x.k === k);
      const vals = S[key].map((row, r) => c.t === 'calc' ? ((D[r] || {})[k] || 0) : num(row[k]));
      if (c.total === 'pay') td.textContent = 'Paid ' + K(sum(vals, v => Math.max(0, v)));
      else td.textContent = fmtCell(c.total, sum(vals, v => v));
    });
  });
  if (sh.after) sh.after();
}

function mountSheet(key, focus) {
  const host = document.getElementById('sheet-' + key);
  if (!host) return;
  host.innerHTML = sheetHtml(key);
  refreshSheet(key);
  renderLists();
  if (focus) { const el = host.querySelector(`[data-r="${focus.r}"][data-k="${focus.k}"]`); if (el) el.focus(); }
}

// ================= Charts =================
function niceMax(m) { if (m <= 0) return 1; const p = 10 ** Math.floor(Math.log10(m)); for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= m) return f * p; return 10 * p; }
const kShort = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n % 1000 ? 1 : 0).replace('.0', '') + 'k' : String(Math.round(n));
function barChart(items, series) {
  const W = 640, H = 220, padL = 44, padB = 26, padT = 10;
  const max = niceMax(Math.max(1, ...items.flatMap(it => series.map(s => it[s.k]))));
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const step = (W - padL - 8) / Math.max(1, items.length);
  const bw = Math.min(22, step / (series.length + 1));
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; g += `<line x1="${padL}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${padL - 6}" y="${y(v) + 4}" font-size="10.5" text-anchor="end" fill="var(--muted)">K ${kShort(v)}</text>`; }
  items.forEach((it, i) => {
    const cx = padL + i * step + step / 2;
    series.forEach((s, j) => {
      const x = cx - (series.length * bw) / 2 + j * bw;
      const v = it[s.k];
      if (v > 0) g += `<rect x="${x + 1}" y="${y(v)}" width="${bw - 2}" height="${y(0) - y(v)}" rx="2" fill="${s.color}"><title>${s.label}: ${K0(v)}</title></rect>`;
    });
    g += `<text x="${cx}" y="${H - 8}" font-size="11" text-anchor="middle" fill="var(--muted)">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}</svg>
    <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>`;
}

// ================= Views =================
const V = {};
let selMonth = null;
const kpiLink = (href, label, value, note, cls = '') => `<a class="card kpi" href="${href}" style="text-decoration:none;color:inherit"><span class="label">${label}</span><span class="value ${cls}">${value}</span>${note ? `<span class="note">${note}</span>` : ''}</a>`;

function nowKpis() {
  const cash = cashMoves().now, st = stockMoves().now, milk = milkMoves().now;
  const owe = sum(Object.values(deriveIntake().bal), v => v);
  const mm = deriveMachineMilk(), inMachines = sum(Object.values(mm.now), v => v);
  return `<div class="grid g-kpi">
    ${kpiLink('#cash', 'Cash in hand now', K0(cash), 'After every payment and sale', cash < 0 ? 'c-out' : '')}
    ${kpiLink('#stock', 'Minerals in stock', G(st), 'After every sale')}
    ${kpiLink('#milk', 'Milk in stock', G(milk), `Plus ${G(inMachines)} inside the machines`)}
    ${kpiLink('#balances', 'Customers still owe us', K0(owe), 'Open advances', 'c-out')}
  </div>`;
}

V.dashboard = () => {
  const cur = todayStr().slice(0, 7);
  const months = allMonths(); if (!months.includes(cur)) months.push(cur);
  if (!selMonth) selMonth = months.includes(cur) ? cur : months[months.length - 1] || cur;
  const inMonth = d => String(d || '').startsWith(selMonth);
  const m = money(inMonth, true);
  const salesRows = S.sales.filter(r => inMonth(r.date));
  const paid = sum(salesRows.filter(r => r.status === 'Paid'), r => num(r.grams) * num(r.price));
  const unpaid = m.sales - paid;
  const mm = deriveMachineMilk();
  const lostMonth = sum(S.machineMilk.map((r, i) => ({ r, d: mm.rows[i] })).filter(x => inMonth(x.r.date)), x => (x.d && x.d.lost) || 0);
  const usedMonth = sum(S.machineMilk.filter(r => inMonth(r.date)), r => num(r.used));
  const outLines = [['Paid for minerals (incl. transport, private)', m.minerals, '#intake'], ['Advances given', m.advances, '#advances'], ['Daily expenses', m.expenses, '#expenses'], ['Milk bought', m.milk, '#milk'], ['Salaries', m.salaries, '#salaries']];
  const maxOut = Math.max(1, ...outLines.map(l => l[1]));
  const weeks = [];
  const lastDate = [...S.sales, ...S.expenses, ...S.intake].map(r => r.date).filter(Boolean).sort().pop() || todayStr();
  let w = monday(lastDate);
  for (let i = 0; i < 8; i++) { weeks.unshift(w); const d = new Date(w + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - 7); w = d.toISOString().slice(0, 10); }
  const wk = weeks.map(ws => { const x = money(d => d && monday(d) === ws, false); return { label: dshort(ws), inn: x.sales, out: x.out }; });

  return head('Overview', 'What we have now, and what came in and went out this month. Click a block to see the details.',
    `<label class="note" for="monthSel">Month</label><select class="btn" id="monthSel">${months.map(x => `<option value="${x}"${x === selMonth ? ' selected' : ''}>${monthName(x)}</option>`).join('')}</select>`) + `
  <h2 style="margin:0 0 10px;font-size:15px">Right now</h2>
  ${nowKpis()}
  <h2 style="margin:22px 0 10px;font-size:15px">${monthName(selMonth)}</h2>
  <div class="grid g-2e">
    <a class="card big in" href="#sales">
      <div class="top"><span class="ic">${svg(I.in)}</span><span class="title">Money in</span><span class="open">Open sales →</span></div>
      <div class="amount">${K0(m.sales)}</div>
      <div class="lines">
        <div class="line"><span>Mineral sales, paid</span><span class="v">${K0(paid)}</span><div class="track"><div class="fill in" style="width:${m.sales ? paid / m.sales * 100 : 0}%"></div></div></div>
        <div class="line"><span>Mineral sales, not paid yet</span><span class="v">${K0(unpaid)}</span><div class="track"><div class="fill" style="width:${m.sales ? unpaid / m.sales * 100 : 0}%"></div></div></div>
        <div class="note">${salesRows.length} sale${salesRows.length === 1 ? '' : 's'} · ${G(sum(salesRows, r => num(r.grams)))} sold</div>
      </div>
    </a>
    <a class="card big out" href="#expenses">
      <div class="top"><span class="ic">${svg(I.out)}</span><span class="title">Money out</span><span class="open">Open expenses →</span></div>
      <div class="amount">${K0(m.out)}</div>
      <div class="lines">${outLines.map(l => `<div class="line"><span>${l[0]}</span><span class="v">${K0(l[1])}</span><div class="track"><div class="fill out" style="width:${l[1] / maxOut * 100}%"></div></div></div>`).join('')}</div>
    </a>
  </div>
  <div class="result"><span>Result for ${monthName(selMonth)} (money in − money out)</span><b class="${m.net >= 0 ? 'c-in' : 'c-out'}">${m.net < 0 ? '− ' : ''}${K0(Math.abs(m.net))}</b></div>
  <div class="grid g-kpi">
    ${kpiLink('#milk-machines', 'Milk used this month', G(usedMonth), 'By all machines')}
    ${kpiLink('#milk-machines', 'Milk lost this month', lostText(lostMonth), lostMonth > 0 ? `Worth about ${K0(lostMonth * num(S.settings.milkPrice))}` : 'Nothing lost', lostMonth > 0 ? 'c-out' : '')}
  </div>
  <div class="card chart"><h2>Last 8 weeks<a class="link" href="#report-week">Weekly report →</a></h2>
    ${barChart(wk, [{ k: 'inn', label: 'Money in', color: 'var(--in)' }, { k: 'out', label: 'Money out (without salaries)', color: 'var(--out)' }])}</div>`;
};

V.start = () => {
  const f = (k, label, help, type = 'text') => `<div class="field"><label for="st-${k}">${label}</label><input${isOwner() ? '' : ' disabled'} id="st-${k}" data-start="${k}" type="${type}" ${type === 'text' ? 'inputmode="decimal"' : ''} value="${esc(S.start[k])}"><small>${help}</small></div>`;

  <div class="card" style="max-width:760px"><h2>1. What you have today</h2><div class="form">
    ${f('date', 'Start date', 'The day you counted everything', 'date')}
    ${f('cash', 'Cash in hand (K)', 'Count the cash in the office')}
    ${f('milk', 'Milk in stock (g)', 'Milk in the store, not inside the machines')}
    ${f('minerals', 'Minerals in stock (g)', 'Minerals you have not sold yet')}
  </div></div>
  <div class="card"><h2>2. Milk inside each machine today</h2><p class="note" style="margin:0 0 10px">This is where each machine starts. The daily milk sheet carries it forward from here.</p>${sheetBlock('machines', 'Add machine')}</div>

V.cash = () => {
  const c = cashMoves();
  const inn = sum(c.moves, m => m.inn), out = sum(c.moves, m => m.out);
  return head('Cash book', 'Cash in hand. It starts from the cash on the Starting point and changes with every paid sale, payment to customers, advance, expense, milk purchase and paid salary. Nothing to type here.') + `
  <div class="grid g-kpi">
    <div class="card kpi"><span class="label">Cash in hand now</span><span class="value ${c.now < 0 ? 'c-out' : ''}">${K0(c.now)}</span><span class="note">Count the cash to check</span></div>
    <div class="card kpi"><span class="label">Cash in</span><span class="value c-in">+ ${K0(inn)}</span><span class="note">Sales marked "Paid"</span></div>
    <div class="card kpi"><span class="label">Cash out</span><span class="value c-out">− ${K0(out)}</span></div>

  </div>
  <div class="card"><h2>Every movement</h2>${dataTable([
    { h: 'Date', f: r => dshort(r.date) }, { h: 'What', f: r => r.start ? chip('Starting cash', 'neutral') : chip(r.what, r.inn ? 'in' : 'out') }, { h: 'Who / what for', f: r => esc(r.who) },
    { h: 'In', num: 1, f: r => r.inn ? `<span class="c-in">+ ${K0(r.inn)}</span>` : '' }, { h: 'Out', num: 1, f: r => r.out ? `<span class="c-out">− ${K0(r.out)}</span>` : '' },
    { h: 'Cash after', num: 1, f: r => `<b>${K0(r.bal)}</b>` }

V.sales = () => head('Sales sheet', 'Every sale of minerals. Minerals sold here are taken off the stock automatically. Sales marked "Paid" are added to the cash.') + sheetBlock('sales', 'Add sale');

const selPeriod = { week: null, month: null };
function periodReport(kind) {
  const keyOf = d => kind === 'week' ? monday(d) : String(d).slice(0, 7);
  const weekEnd = k => { const d = new Date(k + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 6); return d.toISOString().slice(0, 10); };
  const labelOf = k => kind === 'week' ? `Week ${dshort(k)} – ${dshort(weekEnd(k))}` : monthName(k);
  const daily = [...S.sales, ...S.expenses, ...S.intake, ...S.advances, ...S.milkBought, ...S.machineMilk];
  const keys = [...new Set(daily.map(r => r.date).filter(Boolean).map(keyOf))].sort();
  if (!keys.length) return `<div class="card"><p class="note" style="margin:0">Nothing entered yet. As soon as the daily sheets have rows, this report fills itself.</p></div>`;
  const cash = cashMoves(), mm = deriveMachineMilk(), intakeD = deriveIntake().rows;
  const upTo = (arr, k, f) => sum(arr.filter(r => r.date && keyOf(r.date) <= k), f);
  const before = (arr, k, f) => sum(arr.filter(r => r.date && keyOf(r.date) < k), f);
  const calc = k => {
    const inP = d => d && keyOf(d) === k;
    const m = money(inP, kind === 'month');
    const s = S.sales.filter(r => inP(r.date));
    const milkRows = S.machineMilk.map((r, i) => ({ r, d: mm.rows[i] })).filter(x => inP(x.r.date));
    return {
      k, inP, milkRows, label: labelOf(k), short: kind === 'week' ? dshort(k) : monthName(k).split(' ')[0].slice(0, 3), ...m,
      count: s.length, soldG: sum(s, r => num(r.grams)), paid: sum(s.filter(r => r.status === 'Paid'), r => num(r.grams) * num(r.price)),
      inG: sum(S.intake.filter(r => inP(r.date)), r => num(r.grams)),
      milkUsed: sum(milkRows, x => num(x.r.used)), milkLost: sum(milkRows, x => (x.d && x.d.lost) || 0),
      cashStart: num(S.start.cash) + before(cash.moves, k, x => x.inn - x.out),
      cashEnd: num(S.start.cash) + upTo(cash.moves, k, x => x.inn - x.out),
      stockEnd: num(S.start.minerals) + upTo(S.intake, k, r => num(r.grams)) - upTo(S.sales, k, r => num(r.grams)),
      milkEnd: num(S.start.milk) + upTo(S.milkBought, k, r => num(r.grams)) - upTo(S.machineMilk, k, r => num(r.added))
    };
  };
  const rows = keys.map(calc);
  if (!keys.includes(selPeriod[kind])) selPeriod[kind] = keys[keys.length - 1];
  const c = rows.find(r => r.k === selPeriod[kind]);
  const line = (t, v, max, cls) => `<div class="line"><span>${t}</span><span class="v">${K0(v)}</span><div class="track"><div class="fill ${cls}" style="width:${max ? v / max * 100 : 0}%"></div></div></div>`;
  const outL = [['Paid for minerals (incl. transport, private)', c.minerals], ['Advances given', c.advances], ['Daily expenses', c.expenses], ['Milk bought', c.milk]].concat(kind === 'month' ? [['Salaries', c.salaries]] : []);
  const maxOut = Math.max(1, ...outL.map(l => l[1]));
  // breakdowns for the chosen period
  const perCat = {}; S.expenses.filter(r => c.inP(r.date)).forEach(r => perCat[r.category || 'Other'] = (perCat[r.category || 'Other'] || 0) + num(r.amount));
  const cats = Object.entries(perCat).sort((a, b) => b[1] - a[1]);
  const perMachine = S.machines.map(mch => {
    const xs = c.milkRows.filter(x => norm(x.r.machine) === norm(mch.no));
    return { no: mch.no, name: mch.name, days: xs.length, added: sum(xs, x => num(x.r.added)), used: sum(xs, x => num(x.r.used)), lost: sum(xs, x => (x.d && x.d.lost) || 0) };
  });
  const perCust = {}; S.intake.forEach((r, i) => { if (!c.inP(r.date)) return; const n = String(r.customer || '?').trim(); const o = perCust[norm(n)] = perCust[norm(n)] || { name: n, g: 0, value: 0, pay: 0 }; o.g += num(r.grams); o.value += (intakeD[i] || {}).value || 0; o.pay += Math.max(0, (intakeD[i] || {}).pay || 0); });
  const custs = Object.values(perCust).sort((a, b) => b.g - a.g);
  const signedK = v => `<b class="${v >= 0 ? 'c-in' : 'c-out'}">${v < 0 ? '− ' : ''}${K0(Math.abs(v))}</b>`;

  return `<div class="sheet-tools" style="margin-bottom:12px"><label class="note" for="periodSel">${kind === 'week' ? 'Week' : 'Month'}</label>
    <select class="btn" id="periodSel" data-kind="${kind}">${[...keys].reverse().map(k => `<option value="${k}"${k === c.k ? ' selected' : ''}>${labelOf(k)}</option>`).join('')}</select>
    <span class="hint">Everything below is added up from the daily sheets. Nothing to type here.</span></div>
  <div class="grid g-2e">
    <div class="card big in"><div class="top"><span class="ic">${svg(I.in)}</span><span class="title">Money in</span></div>
      <div class="amount">${K0(c.sales)}</div>
      <div class="lines">${line('Mineral sales, paid', c.paid, c.sales, 'in')}${line('Mineral sales, not paid yet', c.sales - c.paid, c.sales, '')}
      <div class="note">${c.count} sale${c.count === 1 ? '' : 's'} · ${G(c.soldG)} sold</div></div></div>
    <div class="card big out"><div class="top"><span class="ic">${svg(I.out)}</span><span class="title">Money out</span></div>
      <div class="amount">${K0(c.out)}</div>
      <div class="lines">${outL.map(l => line(l[0], l[1], maxOut, 'out')).join('')}</div></div>
  </div>
  <div class="result"><span>Result for ${c.label} (money in − money out)</span>${signedK(c.net)}</div>
  <div class="grid g-kpi">
    <div class="card kpi"><span class="label">Cash</span><span class="value">${K0(c.cashEnd)}</span><span class="note">At the end · was ${K0(c.cashStart)} at the start</span></div>
    <div class="card kpi"><span class="label">Minerals</span><span class="value">${G(c.stockEnd)}</span><span class="note">In stock at the end · +${G(c.inG)} in, −${G(c.soldG)} sold</span></div>
    <div class="card kpi"><span class="label">Milk</span><span class="value">${G(c.milkEnd)}</span><span class="note">In stock at the end · ${G(c.milkUsed)} used</span></div>
    <div class="card kpi"><span class="label">Milk lost</span><span class="value ${c.milkLost > 0 ? 'c-out' : ''}">${lostText(c.milkLost)}</span><span class="note">${c.milkLost > 0 ? 'About ' + K0(c.milkLost * num(S.settings.milkPrice)) : 'Nothing lost'}</span></div>
  </div>
  <div class="grid g-2e">
    <div class="card"><h2>Milk per machine</h2>${dataTable([
      { h: 'Machine', f: r => `<b>${esc(r.no)}</b> ${esc(r.name)}` }, { h: 'Days', num: 1, f: r => r.days },
      { h: 'Added', num: 1, f: r => G(r.added) }, { h: 'Used', num: 1, f: r => G(r.used) },
      { h: 'Lost', num: 1, f: r => `<span class="${r.lost > 0 ? 'c-out' : ''}">${lostText(r.lost)}</span>` }
    ], perMachine, ['Total', sum(perMachine, r => r.days), G(sum(perMachine, r => r.added)), G(sum(perMachine, r => r.used)), lostText(sum(perMachine, r => r.lost))])}</div>
    <div class="card"><h2>Expenses per category</h2>${cats.length ? `<div class="lines">${cats.map(([t, v]) => line(esc(t), v, cats[0][1], 'out')).join('')}</div>
      <p class="note" style="margin:12px 0 0">Total ${K0(c.expenses)}</p>` : '<p class="note" style="margin:0">No expenses.</p>'}</div>
  </div>
  <div class="card"><h2>Minerals brought in per customer</h2>${custs.length ? dataTable([
    { h: 'Customer', f: r => `<b>${esc(r.name)}</b>` }, { h: 'Minerals', num: 1, f: r => G(r.g) }, { h: 'Value', num: 1, f: r => K0(r.value) }, { h: 'Paid to customer', num: 1, f: r => K0(r.pay) }
  ], custs, ['Total', G(sum(custs, r => r.g)), K0(sum(custs, r => r.value)), K0(sum(custs, r => r.pay))]) : '<p class="note" style="margin:0">No minerals brought in.</p>'}</div>
  <div class="card chart"><h2>All ${kind === 'week' ? 'weeks' : 'months'}</h2>${barChart((kind === 'week' ? rows.slice(-10) : rows).map(r => ({ label: r.short, inn: r.sales, out: r.out })), [{ k: 'inn', label: 'Money in', color: 'var(--in)' }, { k: 'out', label: kind === 'week' ? 'Money out (without salaries)' : 'Money out', color: 'var(--out)' }])}</div>
  <div class="card">${dataTable([
    { h: kind === 'week' ? 'Week' : 'Month', f: r => r.k === c.k ? `<b>${r.label}</b>` : r.label },
    { h: 'Minerals in', num: 1, f: r => G(r.inG) }, { h: 'Minerals sold', num: 1, f: r => G(r.soldG) },
    { h: 'Money in', num: 1, f: r => `<span class="c-in">${K0(r.sales)}</span>` }, { h: 'Money out', num: 1, f: r => `<span class="c-out">${K0(r.out)}</span>` },
    { h: 'Result', num: 1, f: r => signedK(r.net) }, { h: 'Milk used', num: 1, f: r => G(r.milkUsed) }, { h: 'Milk lost', num: 1, f: r => lostText(r.milkLost) },
    { h: 'Cash at end', num: 1, f: r => `<b>${K0(r.cashEnd)}</b>` }
  ], [...rows].reverse(), ['Total', G(sum(rows, r => r.inG)), G(sum(rows, r => r.soldG)), K0(sum(rows, r => r.sales)), K0(sum(rows, r => r.out)), signedK(sum(rows, r => r.net)), G(sum(rows, r => r.milkUsed)), lostText(sum(rows, r => r.milkLost)), ''])}
  ${kind === 'week' ? '<p class="note" style="margin:10px 0 0">Salaries are paid monthly, so they are in the monthly report only. Cash at end does include salaries marked "Paid".</p>' : ''}</div>`;
}
V['report-week'] = () => head('Weekly report', 'Monday to Sunday. Everything entered during the week, added up automatically.') + periodReport('week');
V['report-month'] = () => head('Monthly report', 'Everything entered during the month, added up automatically, including salaries.') + periodReport('month');

V.expenses = () => head('Daily expenses', 'Food, fuel, gas, transport, repairs and other daily costs. Each one is taken off the cash automatically.') + sheetBlock('expenses', 'Add expense');

V['milk-machines'] = () => head('Milk per machine', 'One row per machine per day. What is left carries over to the next day by itself. Milk added here is taken off the milk stock.') + `
  <div class="grid g-kpi" id="milkSummary"></div>
  <div class="legend-row" style="margin:6px 0 4px"><span><i style="background:var(--surface)"></i>You type</span><span><i style="background:var(--calc)"></i>Calculated</span>
  <span>Balance = from day before + added − used · Lost = balance − counted left</span></div>` +
  sheetBlock('machineMilk', 'Add one row', `<button class="btn" data-add-day="1">+ Add today for all ${S.machines.length} machines</button>`);
function renderMilkSummary() {

  }).join('') + `<div class="card kpi"><span class="label">All machines</span><span class="value">${G(sum(Object.values(d.now), v => v))}</span><span class="note">Lost so far: <b class="${totalLost > 0 ? 'c-out' : ''}">${lostText(totalLost)}</b>${totalLost > 0 ? ` · about ${K0(totalLost * num(S.settings.milkPrice))}` : ''}</span></div>`;
}

V.milk = () => head('Milk stock', 'Milk in the store. Starts from the Starting point, goes up when you buy milk and down when milk is given to a machine.') + `
  <div id="milkStock"></div>
  <div class="card"><h2>Milk bought</h2><p class="note" style="margin:0 0 10px">The amount paid is taken off the cash.</p>${sheetBlock('milkBought', 'Add milk bought')}</div>
  <div class="card"><h2>Every movement</h2><div id="milkMoves"></div></div>`;
function renderMilkStock() {

    <div class="card kpi"><span class="label">Milk in stock now</span><span class="value ${st.now < 0 ? 'c-out' : ''}">${G(st.now)}</span></div>
    <div class="card kpi"><span class="label">Bought</span><span class="value c-in">+ ${G(inn)}</span></div>
    ${kpiLink('#milk-machines', 'Given to machines', '− ' + G(out), 'See milk per machine', 'c-out')}
    ${kpiLink('#start', 'Starting stock', G(num(S.start.milk)), 'Change on Starting point')}
  </div>`;

// ================= Online saving (Supabase) =================
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
function newRow(key, row) { if (CLOUD) { row._id = uuid(); row._by = me && me.id; } return row; }
function cleanRow(row) { const o = {}; Object.keys(row).forEach(k => { if (k[0] !== '_') o[k] = row[k]; }); return o; }
function fromEntry(e) { return Object.assign({}, e.data, { _id: e.id, _by: e.created_by }); }
function localRows() {
  let d = null; try { d = JSON.parse(localStorage.getItem('somzam-live')); } catch (e) { d = null; }
  if (!d || typeof d !== 'object') return 0;
  return sum(Object.keys(SHEETS).filter(k => k !== 'machines' && Array.isArray(d[k])), k => d[k].length);
}

function setSync(state) {
  const el = document.getElementById('syncPill'); if (!el) return;
  const map = { local: ['Saved in this browser only', ''], saving: ['Saving…', ''], saved: ['Online · all saved', 'ok'], error: ['Not saved · check internet', 'bad'], loading: ['Loading…', ''] };
  const [t, cls] = map[state] || map.local;
  el.textContent = t; el.className = 'test-pill ' + cls;
}

const pending = new Map();
let flushTimer = null, inFlight = 0;
function saveRow(key, row) { if (!CLOUD) return persist(); if (!row._id) row._id = uuid(); pending.set(row._id, { key, row }); queueFlush(500); }
function saveSetting(k) { if (!CLOUD) return persist(); pending.set('setting:' + k, { setting: k }); queueFlush(500); }
function queueFlush(ms) { setSync('saving'); clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
async function flush() {
  clearTimeout(flushTimer);
  const items = [...pending.values()]; pending.clear();
  if (!items.length) { if (!inFlight) setSync('saved'); return; }
  inFlight++;
  const rows = items.filter(i => i.row).map(i => ({ id: i.row._id, sheet: i.key, data: cleanRow(i.row) }));
  const sets = items.filter(i => i.setting).map(i => ({ key: i.setting, value: S[i.setting] }));
  let err = null;
  try {
    if (rows.length) { const r = await sb.from('entries').upsert(rows); if (r.error) err = r.error; }
    if (sets.length && !err) { const r = await sb.from('settings').upsert(sets); if (r.error) err = r.error; }
  } catch (e) { err = e; }
  inFlight--;
  if (!err) { setSync(pending.size ? 'saving' : 'saved'); return; }
  const network = !err.code || /fetch|network|timeout/i.test(String(err.message));
  if (network) {
    items.forEach(i => { const id = i.row ? i.row._id : 'setting:' + i.setting; if (!pending.has(id)) pending.set(id, i); });
    setSync('error'); queueFlush(5000); setSync('error');
  } else {
    setSync('error'); toast('Not saved: ' + err.message); reloadCloud();
  }
}
async function removeRow(key, row) {
  if (!CLOUD) return persist();
  pending.delete(row._id);
  const r = await sb.from('entries').delete().eq('id', row._id);
  if (r.error) { toast('Not deleted: ' + r.error.message); reloadCloud(); }
}
window.addEventListener('beforeunload', e => { if (CLOUD && (pending.size || inFlight)) { flush(); e.preventDefault(); e.returnValue = ''; } });

async function loadCloud() {
  const fresh = JSON.parse(JSON.stringify(EXAMPLE));
  Object.keys(SHEETS).forEach(k => fresh[k] = []);
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('entries').select('id,sheet,data,created_by').order('created_at').order('id').range(from, from + 999);
    if (error) throw error;
    data.forEach(e => { if (fresh[e.sheet]) fresh[e.sheet].push(fromEntry(e)); });
    if (data.length < 1000) break;
  }
  const st = await sb.from('settings').select('key,value');
  if (st.error) throw st.error;
  st.data.forEach(r => { if (fresh[r.key] && r.value) Object.assign(fresh[r.key], r.value); });
  const pr = await sb.from('profiles').select('id,name,email,role');
  if (pr.error) throw pr.error;
  people = {}; pr.data.forEach(p => people[p.id] = p);
  if (me && people[me.id]) me = people[me.id];
  // keep rows this person is still typing that the server does not have yet
  pending.forEach(i => { if (i.row && fresh[i.key] && !fresh[i.key].some(r => r._id === i.row._id)) fresh[i.key].push(i.row); });
  S = fresh;
  if (!S.machines.length) {
    S.machines = EXAMPLE.machines.map(m => newRow('machines', Object.assign({}, m)));
    if (isOwner()) S.machines.forEach(m => saveRow('machines', m));
  }
  lastLoad = Date.now();
}
let lastLoad = 0, reloading = null;
function reloadCloud() {
  if (!CLOUD || !me || reloading) return reloading;
  reloading = (async () => { try { if (pending.size) await flush(); await loadCloud(); liveRender(); } catch (e) { setSync('error'); } finally { reloading = null; } })();
  return reloading;
}

let renderWanted = false;
function liveRender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#view') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) { renderWanted = true; return; }
  renderWanted = false;
  renderUser(); route(true); renderLists();
}
document.addEventListener('focusout', () => setTimeout(() => { if (renderWanted) liveRender(); }, 60));

function subscribe() {
  sb.channel('somzam-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'entries' }, p => {
      if (p.eventType === 'DELETE') {
        const id = p.old && p.old.id;
        Object.keys(SHEETS).forEach(k => { const i = S[k].findIndex(r => r._id === id); if (i >= 0) S[k].splice(i, 1); });
      } else {
        const e = p.new;
        if (!e || !S[e.sheet] || pending.has(e.id)) return;
        const arr = S[e.sheet], i = arr.findIndex(r => r._id === e.id), row = fromEntry(e);
        if (i >= 0) { Object.keys(arr[i]).forEach(k => delete arr[i][k]); Object.assign(arr[i], row); } else arr.push(row);
      }
      liveRender();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, p => {
      const r = p.new; if (r && S[r.key] && r.value && !pending.has('setting:' + r.key)) { Object.assign(S[r.key], r.value); liveRender(); }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, p => {
      const r = p.new; if (!r || !r.id) return;
      people[r.id] = r;
      if (me && r.id === me.id) { if (r.role === 'pending') { sb.auth.signOut().finally(() => location.reload()); return; } me = r; }
      liveRender();
    })
    .subscribe(status => { if (status === 'SUBSCRIBED' && Date.now() - lastLoad > 5000) reloadCloud(); });
}
window.addEventListener('online', () => { if (CLOUD && me) { flush(); reloadCloud(); } });
document.addEventListener('visibilitychange', () => { if (CLOUD && me && document.visibilityState === 'visible' && Date.now() - lastLoad > 60000) reloadCloud(); });

async function importData(d, label) {
  if (!isOwner()) return;
  const sheets = Object.keys(SHEETS).filter(k => Array.isArray(d[k]) && d[k].length);
  const count = sum(sheets.filter(k => k !== 'machines'), k => d[k].length);
  if (!confirm(`Upload ${count} rows from ${label} to the online database? Rows already online stay as they are, so do this only once.`)) return;
  sheets.forEach(k => {
    if (k === 'machines') {
      d.machines.forEach(m => {
        const ex = S.machines.find(x => norm(x.no) === norm(m.no));
        if (ex) { Object.assign(ex, cleanRow(m)); saveRow('machines', ex); }
        else { const r = newRow('machines', cleanRow(m)); S.machines.push(r); saveRow('machines', r); }
      });
      return;
    }
    d[k].forEach(r => { const row = newRow(k, cleanRow(r)); S[k].push(row); saveRow(k, row); });
  });
  ['settings', 'start'].forEach(k => { if (d[k] && typeof d[k] === 'object') { Object.assign(S[k], d[k]); saveSetting(k); } });
  await flush();
  route(true); toast(`${count} rows uploaded`);
}

async function updatePerson(t) {
  const id = t.dataset.person, f = t.dataset.f, v = t.value;
  if (f === 'role' && me && id === me.id && v !== 'owner' && !confirm('You are taking away your own owner rights. Continue?')) { t.value = 'owner'; return; }

  if (error) { toast('Not saved: ' + error.message); return; }

  toast('Saved');
}

async function startSession() {
  const { data } = await sb.auth.getSession();
  const session = data && data.session;
  if (!session) return showLogin();
  const pr = await sb.from('profiles').select('id,name,email,role').eq('id', session.user.id).maybeSingle();
  if (pr.error) return showLogin('Could not connect. Check the internet and try again.');
  if (!pr.data || pr.data.role === 'pending') { await sb.auth.signOut(); return showLogin('Your account is waiting for the owner to approve it. Ask the owner, then log in again.'); }

  setSync(pending.size ? 'saving' : 'saved');
  renderUser(); renderLists(); route();
  subscribe();
}

function boot() {

}

// ================= Router =================
const label = {};
NAV.forEach(n => n.children ? n.children.forEach(c => label[c.id] = [n.label, c.label]) : label[n.id] = [null, n.label]);
const openGroups = new Set();
function renderNav(active) {
  document.getElementById('nav').innerHTML = NAV.map((n, gi) => {
    if (!n.children) return `<a class="nav-item ${active === n.id ? 'active' : ''}" href="#${n.id}">${svg(I[n.icon])}${n.label}</a>`;
    const open = openGroups.has(gi);
    const kids = n.children.filter(c => pageAllowed(c.id));
    if (!kids.length) return '';
    return `<div class="nav-group ${open ? 'open' : ''}"><button data-group="${gi}" aria-expanded="${open}">${svg(I[n.icon])}${n.label}${svg(I.chev, 'chev')}</button>
      <div class="sub">${kids.map(c => `<a href="#${c.id}" class="${active === c.id ? 'active' : ''}">${c.label}</a>`).join('')}</div></div>`;
  }).join('');
}
const pageAllowed = id => id === 'team' ? CLOUD && isOwner() : id === 'salaries' ? isOwner() : true;
function currentId() { const h = location.hash.slice(1); return V[h] && pageAllowed(h) ? h : 'dashboard'; }
function route(keepScroll) {
  const id = currentId();
  NAV.forEach((n, gi) => { if (n.children && n.children.some(c => c.id === id)) openGroups.add(gi); });
  renderNav(id);
  const [grp, name] = label[id];
  document.getElementById('crumb').innerHTML = grp ? `${grp} / <b>${name}</b>` : `<b>${name}</b>`;
  document.getElementById('view').innerHTML = V[id]();
  document.querySelectorAll('#view [id^="sheet-"]').forEach(h => mountSheet(h.id.slice(6)));
  document.getElementById('app').classList.remove('menu-open');
  if (!keepScroll) window.scrollTo(0, 0);
}

let toastTimer;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2400); }

// ================= Events =================
function onCellChange(e) {
  const t = e.target;
  const table = t.closest('table.sheet');
  if (table && t.dataset.k !== undefined) {
    const key = table.dataset.sheet;
    const row = S[key][+t.dataset.r];
    const col = SHEETS[key].cols.find(c => c.k === t.dataset.k);
    if (!canEdit(key, row)) return;
    row[t.dataset.k] = col.t === 'num' ? (t.value.trim() === '' ? '' : num(t.value)) : t.value;
    saveRow(key, row);
    refreshSheet(key);
    return;
  }
  if (t.dataset.set) { if (!isOwner()) return; S.settings[t.dataset.set] = num(t.value); saveSetting('settings'); return; }
  if (t.dataset.start) { if (!isOwner()) return; S.start[t.dataset.start] = t.dataset.start === 'date' ? t.value : num(t.value); saveSetting('start'); renderStartNow(); return; }
  if (t.dataset.person && e.type === 'change') { updatePerson(t); return; }
  if (t.id === 'monthSel') { selMonth = t.value; route(); }
  if (t.id === 'periodSel') { selPeriod[t.dataset.kind] = t.value; route(); }
}
document.addEventListener('input', e => { if (e.target.closest('table.sheet') || e.target.dataset.set || e.target.dataset.start) onCellChange(e); });
document.addEventListener('change', onCellChange);
document.addEventListener('change', e => {
  if (e.target.id !== 'restoreFile' || !e.target.files[0]) return;
  const file = e.target.files[0];
  file.text().then(txt => {
    const d = JSON.parse(txt);
    if (!d || typeof d !== 'object' || !Array.isArray(d.machines) || !d.start) throw new Error('not a SomZam backup');
    if (CLOUD) { importData(d, 'the file "' + file.name + '"'); return; }
    if (!confirm('Replace the data in this browser with the backup "' + file.name + '"?')) return;
    S = JSON.parse(JSON.stringify(EXAMPLE)); Object.keys(S).forEach(k => { if (d[k] !== undefined) S[k] = d[k]; });
    persist(); selMonth = null; route(); toast('Backup restored');
  }).catch(() => toast('This file is not a SomZam backup')).finally(() => { e.target.value = ''; });
});
document.addEventListener('focusout', e => { if (e.target.closest('table.sheet')) renderLists(); });

document.addEventListener('keydown', e => {
  const t = e.target, table = t.closest && t.closest('table.sheet');
  if (!table || t.dataset.k === undefined) return;
  const isSelect = t.tagName === 'SELECT';
  let d = 0;
  if (e.key === 'Enter') d = e.shiftKey ? -1 : 1;
  else if (!isSelect && e.key === 'ArrowDown') d = 1;
  else if (!isSelect && e.key === 'ArrowUp') d = -1;
  if (!d) return;
  e.preventDefault();
  const key = table.dataset.sheet, r = +t.dataset.r + d, k = t.dataset.k;
  const next = table.querySelector(`[data-r="${r}"][data-k="${k}"]`);
  if (next) next.focus();
  else if (d > 0 && canAdd(key)) addRow(key, k);
});

document.addEventListener('click', e => {
  const g = e.target.closest('[data-group]');
  if (g) { const i = +g.dataset.group; openGroups.has(i) ? openGroups.delete(i) : openGroups.add(i); renderNav(currentId()); return; }
  const add = e.target.closest('[data-add]');
  if (add) { addRow(add.dataset.add); return; }
  if (e.target.closest('[data-add-day]')) {
    const first = S.machineMilk.length;
    machineNos().forEach(no => { const row = newRow('machineMilk', { date: todayStr(), machine: no, added: '', used: '', left: '' }); S.machineMilk.push(row); saveRow('machineMilk', row); }); mountSheet('machineMilk', { r: first, k: 'added' }); toast(`${machineNos().length} rows added for today`); return;
  }
  const del = e.target.closest('[data-del]');
  if (del) { const key = del.closest('table.sheet').dataset.sheet; const row = S[key][+del.dataset.del]; if (!row || !canEdit(key, row)) return; S[key].splice(+del.dataset.del, 1); removeRow(key, row); mountSheet(key); toast('Row deleted'); return; }
  if (e.target.id === 'uploadLocalBtn') { let d = null; try { d = JSON.parse(localStorage.getItem('somzam-live')); } catch (err) { d = null; } if (d) importData(d, 'this browser'); return; }
  if (e.target.id === 'logoutBtn') { sb.auth.signOut().finally(() => location.reload()); return; }
  if (e.target.id === 'backupBtn') {
    const url = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = 'somzam-backup-' + todayStr() + '.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000); toast('Backup downloaded'); return;
  }
  if (e.target.id === 'restoreBtn') { document.getElementById('restoreFile').click(); return; }
  if (e.target.id === 'clearBtn') {
    if (!confirm('Delete ALL data in this browser and start empty? Download a backup first if you want to keep it.')) return;
    S = JSON.parse(JSON.stringify(EXAMPLE)); S.start.date = todayStr(); persist(); selMonth = null; route(); toast('Everything cleared'); return;
  }
});
document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('app').classList.add('menu-open'));
document.getElementById('scrim').addEventListener('click', () => document.getElementById('app').classList.remove('menu-open'));
window.addEventListener('hashchange', () => route());
boot();
</script>

</html>
